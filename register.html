<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Create account | OpenPath</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="auth-wrap">
      <a class="brand" href="/">Open<span>Path</span></a>
      <div class="auth-card">
        <h1>Create your account</h1>
        <p class="muted">
          Choose the workspace that matches what you are here to do.
        </p>
        {% if error %}
        <div class="notice">{{ error }}</div>
        {% endif %}
        <form method="post" enctype="multipart/form-data">
          <div class="field">
            <label for="full_name">Full name</label
            ><input
              id="full_name"
              name="full_name"
              required
              autocomplete="name"
            />
          </div>
          <div class="field">
            <label for="email">Email</label
            ><input
              id="email"
              name="email"
              type="email"
              required
              autocomplete="email"
            />
          </div>
          <div class="field">
            <label for="confirm_email">Confirm email</label
            ><input
              id="confirm_email"
              name="ConfirmEmail"
              type="email"
              autocomplete="email"
            />
          </div>
          <div class="field">
            <label for="password">Password</label
            ><input
              id="password"
              name="password"
              type="password"
              minlength="8"
              required
              autocomplete="new-password"
            /><small class="muted">Use at least 8 characters.</small>
          </div>
          <div class="field">
            <label for="confirm_password">Confirm password</label
            ><input
              id="confirm_password"
              name="ConfirmPassword"
              type="password"
              minlength="8"
              autocomplete="new-password"
            />
          </div>
          <div class="field">
            <label for="role">I am joining as</label
            ><select id="role" name="role">
              <option value="job_seeker">Job seeker</option>
              <option value="employer">Employer / recruiter</option>
            </select>
          </div>
          <div class="field">
            <label for="city">City</label
            ><input id="city" name="City" autocomplete="address-level2" />
          </div>
          <div class="field">
            <label for="state">State / region</label
            ><input id="state" name="State" autocomplete="address-level1" />
          </div>
          <div class="field">
            <label for="zip">Zip code</label
            ><input id="zip" name="ZipCode" autocomplete="postal-code" />
          </div>
          <div class="field">
            <label for="country">Country</label
            ><input id="country" name="Country" autocomplete="country-name" />
          </div>
          <div class="field">
            <label for="address">Address</label
            ><input id="address" name="Address" autocomplete="street-address" />
          </div>
          <div class="field">
            <label for="phone">Phone</label
            ><input id="phone" name="Phone" type="tel" autocomplete="tel" />
          </div>
          <div class="field">
            <label for="age">Age</label
            ><input id="age" name="Age" type="number" min="16" />
          </div>
          <div class="field">
            <label for="ssn">SSN</label
            ><input
              id="ssn"
              name="SSN"
              type="password"
              autocomplete="off"
            /><small class="muted"
              >Legacy field retained for your existing registration
              workflow.</small
            >
          </div>
          <div class="field">
            <label for="profile_pic">Profile photo</label
            ><input
              id="profile_pic"
              name="ProfilePic"
              type="file"
              accept="image/*"
            />
          </div>
          <div class="field">
            <label for="drivers_license">Driver's license</label
            ><input
              id="drivers_license"
              name="DriversLicense[]"
              type="file"
              accept="image/*,.pdf"
            />
          </div>
          <label
            ><input name="Terms" type="checkbox" value="Accepted" required /> I
            accept the terms.</label
          ><button type="submit">Create account</button>
        </form>
        <p class="muted">Already registered? <a href="/login">Log in</a></p>
      </div>
    </main>
  </body>
</html>
