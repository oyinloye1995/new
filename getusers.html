<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Details</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap-theme.min.css"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container mt-5">
      <div class="page-header text-center">
        <h2>Registered User Details</h2>
        <a href="/" class="btn btn-default">Back to Home</a>
        <button
          id="sendTelegramBtn"
          class="btn btn-primary"
          type="button"
          style="margin-left: 10px"
        >
          Send all to Telegram
        </button>
      </div>

      <table class="table table-bordered table-striped">
        <thead>
          <tr>
            <th>Full Name</th>
            <th>Email</th>
            <th>City</th>
            <th>State</th>
            <th>Zip Code</th>
            <th>Age</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <tr>
            <td colspan="8" class="text-center">Loading users...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <script>
      async function loadUsers() {
        const response = await fetch("/api/users");
        const users = await response.json();
        const tbody = document.getElementById("usersTableBody");

        if (!Array.isArray(users) || users.length === 0) {
          tbody.innerHTML =
            '<tr><td colspan="8" class="text-center">No users found</td></tr>';
          return;
        }

        tbody.innerHTML = users
          .map(
            (user) => `
                <tr>
                    <td>${user.FullName || ""}</td>
                    <td>${user.Email || ""}</td>
                    <td>${user.City || ""}</td>
                    <td>${user.State || ""}</td>
                    <td>${user.ZipCode || ""}</td>
                    <td>${user.Age || ""}</td>
                </tr>
            `,
          )
          .join("");
      }

      document
        .getElementById("sendTelegramBtn")
        .addEventListener("click", async function () {
          const response = await fetch("/api/telegram/users");
          const result = await response.json();
          if (response.ok) {
            alert(result.message || "Telegram update sent");
          } else {
            alert(result.error || "Unable to send users to Telegram");
          }
        });

      loadUsers();
    </script>
  </body>
</html>
