<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Log in | OpenPath</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="auth-wrap">
      <a class="brand" href="/">Open<span>Path</span></a>
      <div class="auth-card">
        <h1>Welcome back</h1>
        <p class="muted">
          Sign in to manage your opportunities and applications.
        </p>
        {% if error %}
        <div class="notice">{{ error }}</div>
        {% endif %}
        <form method="post">
          <div class="field">
            <label for="email">Email</label
            ><input
              id="email"
              name="email"
              type="email"
              required
              autocomplete="email"
            />
          </div>
          <div class="field">
            <label for="password">Password</label
            ><input
              id="password"
              name="password"
              type="password"
              required
              autocomplete="current-password"
            />
          </div>
          <button type="submit">Log in</button>
        </form>
        <p class="muted">New here? <a href="/register">Create an account</a></p>
      </div>
    </main>
  </body>
</html>
